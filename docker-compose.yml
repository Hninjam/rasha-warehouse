version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rasha_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./server
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rasha_db}
      JWT_SECRET: ${JWT_SECRET:?set in .env (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./server:/usr/src/app
    command: npm run dev

volumes:
  pgdata:
